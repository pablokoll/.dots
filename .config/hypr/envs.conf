# Extra env variables
# env = MY_GLOBAL_ENV,setting

# Allow both GPUs (NVIDIA + AMD) for dual display setup
# Disable explicit sync to prevent crashes with dual GPU
env = AQ_NO_EXPLICIT_SYNC,1
env = OMARCHY_SCREENSHOT_DIR,/home/pablo/Pictures/Screenshots
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
